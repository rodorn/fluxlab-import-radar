name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Smoke test CLI (scan + calc na przykladowych danych)
        run: |
          python -m import_radar.cli scan --top 5 --json-out out/ci_ranking.json
          python -m import_radar.cli calc --price-eur 13500 --pl-price 72000 --cc 1498 --class compact
